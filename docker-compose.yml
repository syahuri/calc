# =============================================================================
# Calc — Videotron Calculator (ELKIFAH PRODUCTION)
# React (Babel-transpiled) + nginx, no database
# =============================================================================
services:
  calc:
    build:
      context: ./source
      dockerfile: Dockerfile
    container_name: calc
    restart: unless-stopped
    env_file: .env
    networks:
      - coolify
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

networks:
  coolify:
    external: true
